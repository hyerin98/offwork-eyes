<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="style.css">
</head>
<body>

        <span class="cells"></span><span class="cap"></span>
      </span>
    </div>
    <div id="buddy">
      <svg id="eyes" viewBox="0 0 200 120" aria-hidden="true">
        <g id="lids"></g>
      </svg>
    </div>
  </div>
  <script src="shapes.js"></script>
  <script src="renderer.js"></script>

</html>
